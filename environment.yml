name: spectra_codec_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # core codec dependencies
  - numpy
  - lxml
  - pandas
  - pyteomics
  - psims       # required by pyteomics' mzML reader
  - pymzml
  - requests
  # examples / notebooks
  - matplotlib
  - scipy
  - scikit-learn
  - seaborn
  - ipykernel
  - tqdm
  - pip
  - pip:
    - huggingface_hub
    - openpyxl
